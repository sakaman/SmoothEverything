name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release, such as v0.1.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG
          } else {
            $env:REF_NAME
          }
          if ($tag -notmatch '^v(?<Version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH format: $tag"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "number=$($Matches.Version)"

      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.version.outputs.tag }}

      - name: Verify tag is on main
        shell: pwsh
        run: |
          & git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The release tag must point to a commit already contained in main.'
          }

      - name: Bootstrap Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
            Invoke-WebRequest -UseBasicParsing https://get.scoop.sh -OutFile $installer
            & $installer -RunAsAdmin
          }
          $scoopShims = Join-Path $env:USERPROFILE 'scoop\shims'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scoopShims

      - name: Install toolchain through Scoop
        shell: pwsh
        run: .\scripts\Setup-Toolchain.ps1 -IncludeInstaller

      - name: Build, test, and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: .\scripts\Publish.ps1 -Version $env:RELEASE_VERSION

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $installer = "artifacts\SmoothEverything-Setup-${env:RELEASE_VERSION}-x64.exe"
          $portable = "artifacts\SmoothEverything-${env:RELEASE_VERSION}-win-x64.zip"
          $checksums = 'artifacts\SHA256SUMS.txt'
          foreach ($asset in @($installer, $portable, $checksums)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Release asset not found: $asset"
            }
          }

          $notes = @"
          Windows x64 release.

          - Use the installer for the normal per-user installation experience.
          - Use the portable archive when installation is not desired.
          - This build is currently unsigned.
          "@
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            "$installer#Windows x64 installer (recommended)",
            "$portable#Windows x64 portable",
            "$checksums#SHA-256 checksums",
            '--verify-tag',
            '--title', "SmoothEverything $env:RELEASE_TAG",
            '--notes', $notes,
            '--generate-notes'
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release creation failed.'
          }
          & gh release view $env:RELEASE_TAG --json url,tagName,isDraft,isPrerelease,assets
